name: autocipher_dart
description: Pure-Dart bindings for the autocipher vault engine over its C ABI (ffi). No Flutter dependency.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.0

dependencies:
  ffi: ^2.1.0
  fixnum: ^1.1.1
  protobuf: ^6.1.0

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0

flutter:
  assets:
    - lib/src/native/